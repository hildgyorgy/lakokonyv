<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Bitó János">
  <meta name="description" content="{{ description }}">
  <title>{{ title }}</title>
  <link rel="icon" type="image/png" sizes="591x591" href="./Lako_icon.png">
  <link rel="apple-touch-icon" sizes="591x591" href="./Lako_icon.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="alternate" hreflang="hu" href="index.html">
  <link rel="alternate" hreflang="en" href="index_en.html">
  <link rel="stylesheet" href="book.css">
</head>
<body>
  <header class="site-header">
    <button class="toc-toggle" type="button" aria-controls="book-toc" aria-expanded="false" aria-label="{{ toc_open }}" data-open-label="{{ toc_open }}" data-close-label="{{ toc_close }}">
      <span aria-hidden="true">☷</span>
    </button>
    <a class="site-title" href="#top">{{ title }}</a>
    <nav class="language-switch" aria-label="{{ language_label }}">
      <a href="index.html" lang="hu" hreflang="hu" data-language="hu" {{ hu_current }} aria-label="Magyar">HU</a>
      <span aria-hidden="true">/</span>
      <a href="index_en.html" lang="en" hreflang="en" data-language="en" {{ en_current }} aria-label="English">EN</a>
    </nav>
  </header>
  <div class="toc-backdrop" aria-hidden="true"></div>
  <main id="top" class="page">
    <div class="sidebar-shell">
      <aside id="book-toc" class="toc" aria-label="{{ contents }}">
      <h2>{{ contents }}</h2>
      {{ toc }}
      </aside>
      <aside class="reading-controls" aria-label="{{ reading_settings }}">
        <div class="color-picker" aria-label="{{ accent }}">
          <span class="color-picker-label">{{ accent }}</span>
          <div class="color-options">
            <button class="color-swatch" type="button" data-color="#FAAF40" aria-label="{{ yellow_orange }}" title="{{ yellow_orange }}"></button>
            <button class="color-swatch" type="button" data-color="#F05A29" aria-label="{{ orange_red }}" title="{{ orange_red }}"></button>
            <button class="color-swatch" type="button" data-color="#ED2B7B" aria-label="{{ magenta }}" title="{{ magenta }}"></button>
            <button class="color-swatch" type="button" data-color="#90278E" aria-label="{{ purple }}" title="{{ purple }}"></button>
            <button class="color-swatch is-default" type="button" data-color="#2A398F" aria-label="{{ ultramarine }}" title="{{ ultramarine }}"></button>
            <button class="color-swatch" type="button" data-color="#58B6DC" aria-label="{{ cyan }}" title="{{ cyan }}"></button>
            <button class="color-swatch" type="button" data-color="#74B64A" aria-label="{{ leaf_green }}" title="{{ leaf_green }}"></button>
            <button class="color-swatch" type="button" data-color="#BED63B" aria-label="{{ yellow_green }}" title="{{ yellow_green }}"></button>
          </div>
          <div class="alignment-picker" aria-label="{{ alignment }}">
            <span class="color-picker-label">{{ alignment }}</span>
            <button class="alignment-option is-selected" type="button" data-alignment="left">{{ left }}</button>
            <span aria-hidden="true">|</span>
            <button class="alignment-option" type="button" data-alignment="justify">{{ justify }}</button>
          </div>
        </div>
      </aside>
    </div>
    <article class="book-content">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">{{ footer }}</footer>
  <script id="language-targets" type="application/json">{{ language_targets }}</script>
  <script src="book.js" defer></script>
</body>
</html>
